name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check code formatting with Black
      run: |
        black --check .
        
    - name: Lint with Flake8
      run: |
        flake8 src tests app --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src tests app --count --ignore=E501,W293,E302,W291,F541,E402,E712,W503,F841,C901 --max-complexity=15 --max-line-length=127 --statistics
        
    - name: Run End-to-End Pipeline
      run: |
        python -m src.run_pipeline
        
    - name: Run tests with pytest
      run: |
        python -m pytest --cov=src --cov=app tests/

  streamlit-smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pipeline Data Generation for App
      run: |
        python -m src.run_pipeline
        
    - name: Smoke test Streamlit App
      run: |
        # Start Streamlit in headless mode in the background
        python -m streamlit run app/streamlit_app.py --server.headless true &
        
        # Save the process ID
        STREAMLIT_PID=$!
        
        # Wait for a few seconds to let it initialize
        sleep 5
        
        # Check if process is still running
        if ps -p $STREAMLIT_PID > /dev/null
        then
           echo "Streamlit started successfully."
           kill $STREAMLIT_PID
        else
           echo "Streamlit app crashed on startup."
           exit 1
        fi
